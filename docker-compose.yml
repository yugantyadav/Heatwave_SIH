# Heatwave EWS — full stack in one command:
#     docker compose up --build        -> http://localhost:8000
#     docker compose --profile dev up  -> also http://localhost:5173 (hot reload)
#
# Default stack: the same multi-stage image serves BOTH the FastAPI app and the
# built frontend, so there is no separate frontend container.
#
#   db        Postgres (plain — ward polygons are stored as GeoJSON text, so
#             PostGIS is not needed)
#   redis     broker for the Celery worker
#   web       uvicorn + the compiled SPA, ports the UI and the API on :8000
#   worker    celery worker with the beat scheduler embedded (--beat), so the
#             6-hourly pipeline runs without a fifth container
#   frontend  OPT-IN (profile: dev) Vite dev server on :5173 for hot reload
#
# Nothing else is required to run this project — the stack above is the whole
# deployment story.
#
# IMPORTANT: web and worker are built from the same image but are separate
# containers. `docker compose build frontend` or `up web` alone does NOT
# recreate the other one, so they can end up running different code. When you
# change backend code or dependencies, always recreate everything:
#     docker compose up -d --build
# A stale worker once scored every ward from a NULL heat index while web looked
# healthy, so treat "recreate all" as the default, not the exception.

name: heatwave

x-app-env: &app-env
  # Plain postgresql:// — Settings.ASYNC_DATABASE_URL rewrites it to +asyncpg,
  # which is what the async engine needs.
  DATABASE_URL: postgresql://heatwave:heatwave@db:5432/heatwave
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: production
  FORECAST_REFRESH_HOURS: "6"
  ALERT_COOLDOWN_HOURS: "6"
  DATA_MAX_AGE_MINUTES: "30"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heatwave
      POSTGRES_USER: heatwave
      POSTGRES_PASSWORD: heatwave
    # No published port on purpose: web and worker reach it over the compose
    # network, and it avoids colliding with a Postgres you already run locally.
    # For a shell: docker compose exec db psql -U heatwave -d heatwave
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatwave -d heatwave"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No curl in python:3.12-slim, so health-check with the interpreter.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-env
    # --beat embeds the scheduler in the worker, so refresh/compute/alert still
    # run on a 6-hourly cadence in this stack.
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--beat", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional: hot-reloading frontend. Off by default because `web` already
  # serves the compiled SPA on :8000.
  #     docker compose --profile dev up
  # ---------------------------------------------------------------------------
  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Same-origin: the Vite dev server proxies /api to the web container, so
      # the browser never does a cross-origin call and CORS stays out of it.
      VITE_API_BASE_URL: ""
      VITE_USE_MOCK_DATA: "false"
      VITE_PROXY_TARGET: "http://web:8000"
    ports:
      - "5173:5173"
    volumes:
      # Source is mounted for hot reload; node_modules is a named volume so the
      # image's Linux install is used instead of a macOS one from the host.
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
